{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}{% endblock%}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
</head>
<body>
  <aside>
    <img src="{% static 'main/img/logo.png' %}" alt="logo">
    <h3><a href="{% url 'home' %}"><li>Главная</li></a></h3>
    <ul>
      <a href="{% url 'pendulum' %}"><li>Маятники</li></a>
      <a href="{% url 'trenie' %}"><li>Трение</li></a>
      <a href="{% url 'brosok' %}"><li>Бросок</li></a>
      <a href="{% url 'kolibel' %}"><li>Колыбель Ньютона</li></a>
    </ul>
  </aside>
  <main>
    <div class="ogl">
      {% block ogl %}{% endblock %}
    </div>
    {% block content %}
    {% endblock%}
  </main>
</body>
</html>
