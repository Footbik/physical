<!-- myapp/templates/index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Python Script</title>
</head>
<body>
    <h1>Run Python Script from GitHub</h1>
    <button id="run-script">Run Script</button>

    <script>
        document.getElementById('manage.py').addEventListener('click', function() {
            fetch('/run-script/')
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                    alert(data.message);
                })
                .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
